# One origin for the interface and the API.
#
# Serving the static build and proxying /api from the same host means the
# browser never makes a cross-origin request, so the API does not have to
# accept any. That removes CORS from the security surface entirely rather than
# configuring it.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Personnel data should not sit in an intermediary's cache.
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    access_log off;

    client_max_body_size 25m;          # matches the attachment limit

    # Hashed asset filenames change whenever their content does, so they can
    # be cached hard; index.html must not be, or an upgrade is invisible until
    # the browser is forced to reload.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Generating a CV or running a match over a large population takes
        # longer than the default 60 seconds allows for.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /health {
        proxy_pass http://backend:8000/health;
        access_log off;
    }

    # A single-page interface: every unknown path is a route inside it, not a
    # missing file.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
